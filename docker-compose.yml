services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_PHP_API_URL=${VITE_PHP_API_URL:-http://localhost:8080}
        - VITE_AI_PROXY_URL=${VITE_AI_PROXY_URL}
    ports:
      - '3000:80'
    depends_on:
      php-backend:
        condition: service_healthy
    networks:
      - stockflow
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  php-backend:
    build:
      context: ./server/php
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    environment:
      - APP_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - SHIPPING_WEBHOOK_SECRET=${SHIPPING_WEBHOOK_SECRET}
      - MSG91_AUTH_KEY=${MSG91_AUTH_KEY}
      - MSG91_SENDER_ID=${MSG91_SENDER_ID}
      - MSG91_TEMPLATE_ID=${MSG91_TEMPLATE_ID}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AI_PRIMARY_PROVIDER=${AI_PRIMARY_PROVIDER}
    env_file:
      - .env
    volumes:
      - php-storage:/var/www/html/storage
    networks:
      - stockflow
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cron:
    build:
      context: ./server/php
      dockerfile: Dockerfile
    entrypoint: ['sh', '-c', 'while true; do php /var/www/html/cron/scheduler.php; sleep 60; done']
    environment:
      - APP_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    env_file:
      - .env
    volumes:
      - php-storage:/var/www/html/storage
    depends_on:
      php-backend:
        condition: service_healthy
    networks:
      - stockflow
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'scheduler']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  stockflow:
    driver: bridge

volumes:
  php-storage:
    driver: local
