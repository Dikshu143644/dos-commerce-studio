<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- SEO & Core Search Metadata -->
    <title>DOS-CRM-ERP — Unified E-Commerce, CRM & Multi-Warehouse ERP Platform</title>
    <meta
      name="description"
      content="DOS-CRM-ERP is a next-generation enterprise platform merging B2B E-Commerce, CRM deal pipelines, multi-warehouse inventory ERP, GST compliance, and autonomous AI WhatsApp multi-agents."
    />
    <meta
      name="keywords"
      content="DOS-CRM-ERP, CRM software, Inventory ERP, B2B Ecommerce, Multi-warehouse management, GST invoice generator, AI WhatsApp agent, abandoned cart recovery, StockFlow, India ERP"
    />
    <meta name="author" content="DOS-CRM-ERP Enterprise" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- OpenGraph & Social Media (AEO / GEO) -->
    <meta property="og:site_name" content="DOS-CRM-ERP" />
    <meta property="og:title" content="DOS-CRM-ERP — Enterprise CRM, Inventory ERP & B2B Wholesale Store" />
    <meta
      property="og:description"
      content="Scale your wholesale commerce with multi-hub warehouse routing, automated GST compliance, and autonomous WhatsApp AI agents."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dos-crm.in/" />
    <meta property="og:image" content="/images/enterprise-scale-bg.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DOS-CRM-ERP — Enterprise CRM, Inventory ERP & B2B Store" />
    <meta
      name="twitter:description"
      content="Automated multi-warehouse inventory, CRM pipelines, and autonomous AI agents."
    />
    <meta name="twitter:image" content="/images/enterprise-scale-bg.jpg" />

    <!-- Schema.org JSON-LD Structured Data for AEO / GEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "DOS-CRM-ERP",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "All Web Browsers, Cloud SaaS",
            "description": "Unified enterprise CRM, Inventory ERP, and B2B E-Commerce storefront with autonomous AI WhatsApp Multi-Agents.",
            "offers": {
              "@type": "AggregateOffer",
              "priceCurrency": "INR",
              "lowPrice": "2499",
              "highPrice": "24999"
            }
          },
          {
            "@type": "Organization",
            "name": "DOS-CRM-ERP Enterprise",
            "url": "https://dos-crm.in",
            "logo": "https://dos-crm.in/favicon.svg",
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+91-98201-44892",
              "contactType": "Customer Support",
              "areaServed": "IN"
            }
          }
        ]
      }
    </script>

    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

  </body>
